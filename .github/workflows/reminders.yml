name: Reminders

# Calls the app's reminder endpoint every hour; the endpoint sends the evening push to devices
# whose local time is in the window and whose owner still has daily tasks left.
# Needs the repository secrets REMINDERS_URL (https://<app>/api/cron/reminders) and CRON_SECRET.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reminder endpoint
        env:
          REMINDERS_URL: ${{ secrets.REMINDERS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$REMINDERS_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "REMINDERS_URL and CRON_SECRET must be set as repository secrets" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$REMINDERS_URL"
